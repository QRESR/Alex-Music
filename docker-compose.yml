version: "3.8"

services:
  music-proxy:
    build: .
    container_name: music-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=UTC
    # Optional: mount yt-dlp config for proxy/cookies
    # volumes:
    #   - ./yt-dlp-config:/root/.config/yt-dlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
